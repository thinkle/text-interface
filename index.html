<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Interface Test</title>
  </head>
  <body>
    <div id="app"></div>
    <!--<script src="./dist/textInterface.umd.cjs"></script>-->
    <script type="module">
      import { TextInterface } from "https://cdn.jsdelivr.net/npm/text-interface@1.0.4/dist/text-interface.js";

      const app = document.getElementById("app");
      const ti = new TextInterface(app, "Testing Text Interface");
      ti.output("Hello, Local Test!");
      ti.output("What is your ame?");
      let result = await ti.readText("What is your name?");
      ti.output(`Hello, ${result}!`);
    </script>
  </body>
</html>
