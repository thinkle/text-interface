<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Math Quiz – Text Interface Demo</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css"
    />
    <style>
      body {
        background: var(--ti-black, #222);
        color: var(--ti-white, #fefefe);
        margin: 0;
        min-height: 100vh;
      }
      .source-toggle {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 1000;
        background: rgba(128, 128, 128, 0.15);
        border: 1px solid rgba(128, 128, 128, 0.25);
        color: var(--ti-white, #fefefe);
        padding: 6px 14px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        font-family: system-ui, sans-serif;
        backdrop-filter: blur(8px);
        transition: all 0.2s;
      }
      .source-toggle:hover {
        background: rgba(128, 128, 128, 0.3);
      }
      .source-panel {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 999;
        background: rgba(0, 0, 0, 0.92);
        backdrop-filter: blur(6px);
        overflow: auto;
        padding: 56px 1rem 2rem;
      }
      .source-panel.open {
        display: block;
      }
      .source-panel pre {
        max-width: 820px;
        margin: 0 auto;
        border-radius: 10px;
      }
      .source-panel pre code {
        font-size: 14px !important;
        line-height: 1.5;
      }
      .back-link {
        position: fixed;
        bottom: 12px;
        left: 12px;
        z-index: 1001;
        color: var(--ti-white, #fefefe);
        font-size: 13px;
        font-family: system-ui, sans-serif;
        text-decoration: none;
        opacity: 0.5;
        transition: opacity 0.2s;
      }
      .back-link:hover {
        opacity: 1;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" id="game-source">
      // ============================================================
      // Math Quiz Game
      // A simple quiz written by a beginning APCSP student.
      // Style: top-level variables, while loops, if statements.
      // Theme: Green Terminal
      // ============================================================

      import {
        TextInterface,
        applyTheme,
        themes,
      } from "../dist/text-interface.es.js";

      // --- Set up the interface ---
      applyTheme(themes.greenTerminal);
      let app = document.getElementById("app");
      let ti = new TextInterface(
        app,
        "🧮 Math Quiz",
        "Type your answer...",
        "> ",
      );
      ti.outputAnimationLength = 400;
      ti.shouldStealFocus = true;

      // --- Game variables ---
      let score = 0;
      let questionNumber = 1;
      let totalQuestions = 5;

      // --- Welcome message ---
      await ti.output("Welcome to the Math Quiz!");
      await ti.output(
        "You will get " + totalQuestions + " random math questions.",
      );
      await ti.output("Let's see how many you can get right!\n");

      // --- Main game loop ---
      while (questionNumber <= totalQuestions) {
        // Pick two random numbers between 1 and 20
        let a = Math.floor(Math.random() * 20) + 1;
        let b = Math.floor(Math.random() * 20) + 1;

        // Pick a random operation
        let operations = ["+", "-", "×"];
        let op = operations[Math.floor(Math.random() * operations.length)];

        // Calculate the correct answer
        let correctAnswer = 0;
        if (op === "+") {
          correctAnswer = a + b;
        }
        if (op === "-") {
          correctAnswer = a - b;
        }
        if (op === "×") {
          correctAnswer = a * b;
        }

        // Ask the question
        await ti.output("Question " + questionNumber + " of " + totalQuestions);
        let userAnswer = await ti.promptNumber(
          "What is " + a + " " + op + " " + b + "?",
          "Please type a number!",
        );

        // Check the answer
        if (userAnswer === correctAnswer) {
          await ti.output("✅ Correct! Nice job!");
          score = score + 1;
        } else {
          await ti.output(
            "❌ Not quite. The answer was " + correctAnswer + ".",
          );
        }

        await ti.output(""); // blank line
        questionNumber = questionNumber + 1;
      }

      // --- Show final score ---
      await ti.output("============================");
      await ti.output(
        "You got " + score + " out of " + totalQuestions + " correct!",
      );

      if (score === totalQuestions) {
        await ti.output("🌟 Perfect score! Amazing!");
      } else if (score >= totalQuestions - 1) {
        await ti.output("🎉 Great job! Almost perfect!");
      } else if (score >= Math.floor(totalQuestions / 2)) {
        await ti.output("👍 Not bad! Keep practicing!");
      } else {
        await ti.output("💪 Keep trying, you'll get better!");
      }

      // --- Play again? ---
      let playAgain = await ti.promptYesOrNo("Do you want to play again?");
      if (playAgain) {
        location.reload();
      } else {
        await ti.output("Thanks for playing! Goodbye! 👋");
      }
    </script>
    <button
      class="source-toggle"
      onclick="
        var p = document.getElementById('source-panel');
        p.classList.toggle('open');
        this.textContent = p.classList.contains('open')
          ? '\u2715 Close'
          : '\uD83D\uDCC4 View Source';
      "
    >
      📄 View Source
    </button>
    <div id="source-panel" class="source-panel">
      <pre><code class="language-javascript" id="source-code"></code></pre>
    </div>
    <a class="back-link" href="index.html">← Back to Demos</a>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script>
      {
        const codeEl = document.getElementById("source-code");
        // In Vite dev mode, the inline module script is replaced with a proxy.
        // We detect that and fetch the proxy URL to get the JS source.
        // In production (static files), we fetch the HTML and extract the inline script.
        const proxyScript = document.querySelector(
          'script[type="module"][src*="html-proxy"]',
        );
        const sourcePromise = proxyScript
          ? fetch(proxyScript.src).then((r) => r.text())
          : fetch(location.pathname)
              .then((r) => r.text())
              .then((html) => {
                const m = html.match(
                  /<script\s+type="module"\s*>([\s\S]{10,}?)<\/script>/i,
                );
                return m ? m[1] : "";
              });
        sourcePromise.then((text) => {
          if (!text) {
            codeEl.textContent =
              "// Source not available.";
            return;
          }
          text = text.replace(/^\n/, "").replace(/\n\s*$/, "");
          const lines = text.split("\n");
          const indent = Math.min(
            ...lines
              .filter((l) => l.trim())
              .map((l) => l.match(/^\s*/)[0].length),
          );
          text = lines.map((l) => l.slice(indent)).join("\n");
          codeEl.textContent = text;
          hljs.highlightElement(codeEl);
        });
      }
    </script>
  </body>
</html>
